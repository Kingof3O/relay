<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0a0d14" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="1"/>
    </radialGradient>

    <!-- Brand Gradients -->
    <linearGradient id="relayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>

    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGlow)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="url(#borderGradient)" stroke-width="1.5"/>

  <!-- Decorative Ambient Spheres -->
  <circle cx="200" cy="80" r="120" fill="#4338ca" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1000" cy="260" r="140" fill="#0891b2" opacity="0.12" filter="url(#glow)"/>

  <!-- Brand Mark Icon (Left-side glowing emblem) -->
  <g transform="translate(130, 95)">
    <!-- Icon Container Box -->
    <rect width="170" height="170" rx="36" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect width="170" height="170" rx="36" fill="url(#relayGradient)" opacity="0.1" filter="url(#glow)"/>

    <!-- Relay Vector Symbol -->
    <g transform="translate(25, 20) scale(3.3)">
      <path d="M9 7C9 5.89543 9.89543 5 11 5H21C25.4183 5 29 8.58172 29 13C29 16.7224 26.4554 19.8506 23 20.7208V20.7208C21.7247 21.0487 21 22.2513 21 23.5685V31" stroke="url(#relayGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)"/>
      <path d="M9 5V31" stroke="url(#relayGradient)" stroke-width="3" stroke-linecap="round"/>
      <path d="M9 18H21" stroke="url(#relayGradient)" stroke-width="3" stroke-linecap="round"/>
      <path d="M20 22L28 31" stroke="url(#relayGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="21" cy="11.5" r="2.3" fill="#38bdf8" filter="url(#subtleGlow)"/>
    </g>
  </g>

  <!-- Title & Typography (Right of Icon) -->
  <g transform="translate(340, 140)">
    <!-- Eyebrow Pill -->
    <g transform="translate(0, -42)">
      <rect width="210" height="26" rx="13" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#10b981"/>
      <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" letter-spacing="1.2">SELF-HOSTED SPRINT ENGINE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#textGradient)" letter-spacing="-1">RELAY STUDIO</text>

    <!-- Subtitle / Mission -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">The Open-Source, High-Velocity Engineering &amp; Agile Delivery Engine</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 102)">
      <!-- Pill 1 -->
      <rect width="130" height="28" rx="6" fill="#1e293b" opacity="0.8"/>
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">⚡ Linear-Grade UX</text>

      <!-- Pill 2 -->
      <g transform="translate(142, 0)">
        <rect width="118" height="28" rx="6" fill="#1e293b" opacity="0.8"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🔒 Self-Hostable</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(272, 0)">
        <rect width="128" height="28" rx="6" fill="#1e293b" opacity="0.8"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">⌨️ Vim &amp; ⌘K Keys</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(412, 0)">
        <rect width="156" height="28" rx="6" fill="#1e293b" opacity="0.8"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🚀 Laravel 13 + React 19</text>
      </g>

      <!-- Pill 5 -->
      <g transform="translate(580, 0)">
        <rect width="124" height="28" rx="6" fill="#1e293b" opacity="0.8"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">📡 Live Reverb Sync</text>
      </g>
    </g>
  </g>
</svg>
