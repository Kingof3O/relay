<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="auto">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bannerGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#141728" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#08090d" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#050608" stop-opacity="1"/>
    </radialGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#1e2230" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Logo Tile Gradient -->
    <linearGradient id="tileBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Atmospheric Glow Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="tileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Dot Matrix -->
    <pattern id="dotPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="350" rx="14" fill="url(#bannerGlow)"/>
  <rect width="1200" height="350" rx="14" fill="url(#dotPattern)"/>
  <rect width="1198" height="348" x="1" y="1" rx="13" fill="none" stroke="url(#cardBorder)" stroke-width="1.2"/>

  <!-- Atmospheric Background Ambient Lights -->
  <circle cx="600" cy="75" r="130" fill="#6366f1" opacity="0.14" filter="url(#softGlow)"/>
  <circle cx="380" cy="190" r="110" fill="#06b6d4" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="820" cy="190" r="110" fill="#a855f7" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Centered Content Structure -->
  <g transform="translate(600, 160)">

    <!-- 1. Real Relay Logo (Exact SVG from public/img/logo.svg) in Dark Obsidian Glass Tile -->
    <g transform="translate(0, -82)">
      <!-- Ambient Glow under Logo Tile -->
      <rect x="-38" y="-38" width="76" height="76" rx="20" fill="#6366f1" opacity="0.18" filter="url(#tileGlow)"/>
      
      <!-- Obsidian Tile Container -->
      <rect x="-35" y="-35" width="70" height="70" rx="18" fill="#111216" stroke="url(#tileBorder)" stroke-width="1.5"/>

      <!-- Real Relay Kinetic Vector Mark (viewBox 0 0 36 36 scaled 1.25x) -->
      <g transform="translate(-22.5, -22.5) scale(1.25)">
        <path d="M9 7C9 5.89543 9.89543 5 11 5H21C25.4183 5 29 8.58172 29 13C29 16.7224 26.4554 19.8506 23 20.7208V20.7208C21.7247 21.0487 21 22.2513 21 23.5685V31" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9 5V31" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M9 18H21" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M20 22L28 31" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="21" cy="11.5" r="2.5" fill="#ffffff"/>
      </g>
    </g>

    <!-- 2. Release Badge Pill -->
    <g transform="translate(0, -26)">
      <rect x="-135" y="-12" width="270" height="24" rx="12" fill="#0b0e17" stroke="#312e81" stroke-width="1"/>
      <circle cx="-116" cy="0" r="3.5" fill="#10b981"/>
      <text x="-104" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#c7d2fe" letter-spacing="1.5">SELF-HOSTABLE AGILE ENGINE</text>
    </g>

    <!-- 3. Brand Typography -->
    <text x="0" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="4">RELAY STUDIO</text>

    <!-- 4. Subtitle / Product Mission -->
    <text x="0" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.3">Sub-Second Issue Velocity • Linear Precision • Sovereign Infrastructure</text>

    <!-- 5. Feature Badges -->
    <g transform="translate(0, 106)">
      <g transform="translate(-320, 0)">
        <rect x="0" y="-12" width="118" height="24" rx="6" fill="#11131c" stroke="#1e2233" stroke-width="1"/>
        <text x="59" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">⚡ Sub-100ms SPA</text>
      </g>
      <g transform="translate(-190, 0)">
        <rect x="0" y="-12" width="115" height="24" rx="6" fill="#11131c" stroke="#1e2233" stroke-width="1"/>
        <text x="57" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">🔒 100% Sovereign</text>
      </g>
      <g transform="translate(-63, 0)">
        <rect x="0" y="-12" width="126" height="24" rx="6" fill="#11131c" stroke="#1e2233" stroke-width="1"/>
        <text x="63" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">⌨️ ⌘K &amp; Vim Keys</text>
      </g>
      <g transform="translate(75, 0)">
        <rect x="0" y="-12" width="125" height="24" rx="6" fill="#11131c" stroke="#1e2233" stroke-width="1"/>
        <text x="62" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">📡 Reverb Live Sync</text>
      </g>
      <g transform="translate(212, 0)">
        <rect x="0" y="-12" width="115" height="24" rx="6" fill="#11131c" stroke="#1e2233" stroke-width="1"/>
        <text x="57" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">🚀 Turnkey Docker</text>
      </g>
    </g>

  </g>
</svg>
