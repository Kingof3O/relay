name: relay-studio

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: relay-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_NAME: "Relay Studio"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: relay
      DB_USERNAME: relay
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: "${REVERB_APP_ID:-relay-studio}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-relay-key}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:-relay-secret}"
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: "8080"
      REVERB_SCHEME: "${REVERB_SCHEME:-http}"
      VITE_REVERB_APP_KEY: "${REVERB_APP_KEY:-relay-key}"
      VITE_REVERB_HOST: "${VITE_REVERB_HOST:-localhost}"
      VITE_REVERB_PORT: "${VITE_REVERB_PORT:-8080}"
      VITE_REVERB_SCHEME: "${VITE_REVERB_SCHEME:-http}"
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: "notifications@relay.studio"
      MAIL_FROM_NAME: "Relay Studio"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage

  db:
    image: mysql:8.4
    container_name: relay-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: relay
      MYSQL_USER: relay
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u relay -p$${MYSQL_PASSWORD:-secret} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: relay-redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --requirepass "$$REDIS_PASSWORD"; else exec redis-server; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: relay-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local
